name: Auto Commit Harian

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cek batas commit harian (50)
        id: limit
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          COUNT=$(git log --since="${TODAY}T00:00:00Z" --oneline | wc -l)
          echo "Commit hari ini: $COUNT"
          if [ "$COUNT" -ge 50 ]; then
            echo "::set-output name=skip::true"
            echo "Batas 50 commit harian tercapai, lewati."
          else
            echo "::set-output name=skip::false"
          fi

      - name: Auto commit
        if: steps.limit.outputs.skip != 'true'
        run: |
          date '+%Y-%m-%dT%H:%M:%SZ' > LAST_UPDATED
          git config --local user.email "fakhri@student.unp.ac.id"
          git config --local user.name "fakhriaditiarahman"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(bot): auto commit"

      - name: GitHub Push
        if: steps.limit.outputs.skip != 'true'
        uses: ad-m/github-push-action@v0.8.0
        with:
          force: true
          directory: "."
          github_token: ${{ secrets.CLASSIC_TOKEN }}
